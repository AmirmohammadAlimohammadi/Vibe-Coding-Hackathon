services:
  backend:
    build:
      context: ./backend
    container_name: liara-chatbot-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://chatbot:chatbot@postgres:5432/chatbot
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: liara_documentation_hybrid
      RAG_MODEL: gpt-5.6-terra
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant-healthcheck:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ingest:
    build:
      context: ./backend
    profiles: ["tools"]
    env_file:
      - ./backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: liara_documentation_hybrid
    volumes:
      - ./llms:/data/llms:ro
    depends_on:
      qdrant-healthcheck:
        condition: service_healthy
    entrypoint:
      [
        "python",
        "-m",
        "app.ingestion.index_documents",
        "--docs-dir",
        "/data/llms",
      ]
    command: []

  inspect-chunks:
    build:
      context: ./backend
    profiles: ["tools"]
    env_file:
      - ./backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: liara_documentation_hybrid
    depends_on:
      qdrant-healthcheck:
        condition: service_healthy
    entrypoint: ["python", "-m", "app.scripts.inspect_qdrant_chunks"]
    command: []

  search-chunks:
    build:
      context: ./backend
    profiles: ["tools"]
    env_file:
      - ./backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: liara_documentation_hybrid
    depends_on:
      qdrant-healthcheck:
        condition: service_healthy
    entrypoint: ["python", "-m", "app.scripts.search_qdrant_chunks"]
    command: []

  migrate-hybrid:
    build:
      context: ./backend
    profiles: ["tools"]
    env_file:
      - ./backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_HYBRID_COLLECTION: liara_documentation_hybrid
    depends_on:
      qdrant-healthcheck:
        condition: service_healthy
    entrypoint: ["python", "-m", "app.scripts.migrate_hybrid_collection"]
    command: []

  postgres:
    image: postgres:16-alpine
    container_name: liara-chatbot-postgres
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: liara-chatbot-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.3
    container_name: liara-chatbot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  qdrant-healthcheck:
    image: curlimages/curl:8.10.1
    container_name: liara-chatbot-qdrant-healthcheck
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://qdrant:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
